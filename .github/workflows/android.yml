name: Build PyTools Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          java -version
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Buildozer system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache git zip unzip autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip==24.3.1 setuptools==75.8.0 wheel==0.45.1
          python -m pip install buildozer cython==0.29.36
          python -m pip --version

      - name: Clean Android build cache
        run: |
          rm -rf .buildozer
          rm -rf ~/.buildozer/android/platform/build-*
          rm -rf ~/.buildozer/android/platform/python-for-android
          rm -rf ~/.buildozer/android/platform/python-for-android-new

      - name: Prepare python-for-android
        run: |
          buildozer android update
          P4A_DIR="$HOME/.buildozer/android/platform/python-for-android"
          test -f "$P4A_DIR/pythonforandroid/build.py"
          python - "$P4A_DIR/pythonforandroid/build.py" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          text = path.read_text()

          if "--clear', 'venv" in text or "--clear\", \"venv" in text:
              print("p4a venv already uses --clear")
              raise SystemExit(0)

          old = "'-m', 'venv', 'venv'"
          new = "'-m', 'venv', '--clear', 'venv'"

          if old not in text:
              raise SystemExit("Could not find p4a venv creation line to patch")

          path.write_text(text.replace(old, new))
          print("Patched p4a temporary venv creation to use --clear")
          PY

      - name: Verify p4a patch
        run: |
          grep -n -A2 -B2 "venv" "$HOME/.buildozer/android/platform/python-for-android/pythonforandroid/build.py" | head -40

      - name: Build debug APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PyTools
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
